services:
  - type: web
    name: docforge-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: M5_ENABLED
        value: "true"
      - key: M4_ENABLED
        value: "true"
      - key: M3_ENABLED
        value: "true"
      - key: M0_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false  # À renseigner manuellement dans le dashboard Render
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: PORT
        value: "10000"